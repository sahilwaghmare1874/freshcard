<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshCart - Launching...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease-in;
        }

        .emoji {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        p {
            font-size: 1.3em;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .status {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .status-item {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            font-size: 1.1em;
        }

        .check {
            color: #4ade80;
            margin-right: 10px;
            font-size: 1.5em;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2em;
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .countdown {
            font-size: 1.5em;
            font-weight: bold;
            color: #fbbf24;
            margin: 20px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🛒</div>
        <h1>FreshCart is Ready!</h1>
        <p>Your e-commerce platform is now running</p>

        <div class="status">
            <div class="status-item">
                <span class="check">✓</span>
                <span>Frontend Server: Running on Port 5500</span>
            </div>
            <div class="status-item">
                <span class="check">✓</span>
                <span>Backend Server: Running on Port 5000</span>
            </div>
            <div class="status-item">
                <span class="check">✓</span>
                <span>All Systems Ready!</span>
            </div>
        </div>

        <div class="countdown">Redirecting in <span id="countdown">3</span> seconds...</div>
        <div class="spinner"></div>

        <p style="font-size: 0.9em; margin-top: 20px;">
            Or click below to go now:
        </p>
        <a href="http://localhost:5500/pages/index.html" class="btn">Open FreshCart →</a>
    </div>

    <script>
        let count = 3;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            count--;
            countdownEl.textContent = count;
            
            if (count === 0) {
                clearInterval(timer);
                window.location.href = 'http://localhost:5500/pages/index.html';
            }
        }, 1000);
    </script>
</body>
</html>
