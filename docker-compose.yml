version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: freshcart-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-freshcart_password}
      MYSQL_DATABASE: ${DB_NAME:-freshcart}
      MYSQL_USER: ${DB_USER:-freshcart_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-freshcart_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    networks:
      - freshcart-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freshcart-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      DB_HOST: mysql
      DB_USER: ${DB_USER:-freshcart_user}
      DB_PASSWORD: ${DB_PASSWORD:-freshcart_password}
      DB_NAME: ${DB_NAME:-freshcart}
      DB_PORT: 3306
      JWT_SECRET: ${JWT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
    volumes:
      - ./server/uploads:/app/server/uploads
    networks:
      - freshcart-network
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:

networks:
  freshcart-network:
    driver: bridge
